---
layout: default
---
<article class="post">
  <div class="post-card">
    {% unless page.title == blank %}
      <h1>{{ page.title }}</h1>
      <span class="post-date">{{ page.date | date: "%Y/%-m/%-d" }}</span>
    {% else %}
      <span class="post-date post-date--heading">{{ page.date | date: "%Y/%-m/%-d" }}</span>
    {% endunless %}
    <div class="post-body">
      {{ content }}
    </div>
    {% if page.tags.size > 0 %}
    <div class="entry-tags">
      {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
  <div class="post-footer">
    <a href="{{ '/' | relative_url }}">← Back</a>
  </div>
</article>

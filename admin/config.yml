# ⬇️ 這一段「backend」請整段換成 DecapBridge 網站幫你產生的內容
# 步驟:decapbridge.com 建立 site 後,它會給你一段 config.yml,
# 把那段「backend: ...」複製過來貼在這裡取代掉下面 3 行就好,
# 下面 collections 的部分不用動。
# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: muginoumini/memo
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/52050f41-8922-470b-9b78-005d7de32f2f/pkce
  auth_token_endpoint: /sites/52050f41-8922-470b-9b78-005d7de32f2f/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://muginoumini.github.io

# 必須新增以下這行（指定上傳圖片/媒體儲存的路徑）
media_folder: "assets/images" # 請依你的專案架構調整，例如 "assets/images" 或 "public/images"
public_folder: "/images"       # 發佈後 HTML 讀取圖片的網址相對路徑

collections:
  - name: "posts"
    label: "日記"
    label_singular: "一篇日記"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { label: "標題", name: "title", widget: "string", required: false, hint: "留空的話,首頁會直接用日期當標題" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss Z", picker_utc: true }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - label: "首頁的顯示方式"
        name: "read_more"
        widget: "select"
        required: false
        default: "auto"
        hint: "選「開啟」的話,首頁只會先顯示一部分,並出現「繼續閱讀」按鈕"
        options:
          - { label: "自動(內容太長才收合)", value: "auto" }
          - { label: "開啟收合按鈕", value: "on" }
          - { label: "永遠顯示全文", value: "off" }
      - { label: "內容", name: "body", widget: "markdown" }

title: memo
description: 記錄一眨眼就會被遺忘的日常
author: 我
lang: zh-Hant

# 部署後請把這裡改成你的網址,例如 https://你的帳號.github.io
url: "https://muginoumini.github.io"

# 如果你的 repo 名稱不是「你的帳號.github.io」,這裡要填 "/你的repo名稱"
# 例如 repo 叫 my-diary,這裡就填 "/my-diary"
baseurl: "/memo"

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-paginate

paginate: 10
paginate_path: "/page:num/"

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
